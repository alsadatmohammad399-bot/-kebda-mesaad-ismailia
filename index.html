<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كبدة مسعد | ملك العروض</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background:#F8F5EF;color:#1A1A1A} .offer-img{border-radius:28px;overflow:hidden;background:#fff;border:1px solid #EDE8E0;transition:.4s} .offer-img:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,0.08)}</style>
</head>
<body>

<header class="sticky top-0 z-50 bg-[#F8F5EF]/90 backdrop-blur-xl border-b border-[#EDE8E0]">
<div class="max-w-6xl mx-auto px-6 h-[76px] flex justify-between items-center">
<div class="flex items-center gap-3"><img src="logo.png" onerror="this.src='https://placehold.co/80x80/1E1E1E/F8F5EF?text=M'" class="w-11 h-11 rounded-full"><div><h1 class="font-black text-[17px]">كبدة مسعد</h1><p class="text-[10px] text-[#9A8F7D]">MALIK EL 3OROUD</p></div></div>
<button onclick="toggleCart()" class="bg-[#1E1E1E] text-white px-6 py-3 rounded-full text-sm font-bold flex gap-2">السلة <span id="cart-count" class="bg-white text-black w-5 h-5 rounded-full flex items-center justify-center text-xs">0</span></button>
</div>
</header>

<section class="max-w-6xl mx-auto px-6 pt-10 pb-6">
<h2 class="text-[48px] font-black leading-[0.9]">عروض<br>جديدة <span class="text-[#C2B6A3]">كتيررر</span> 👋🥙</h2>
</section>

<section class="max-w-6xl mx-auto px-6 pb-20">
<div id="offers" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

<div class="mt-16">
<h3 class="font-black text-xl mb-6">السندوتشات - بصور حقيقية 📸</h3>
<div id="menu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</div>
</section>

<div id="cart" class="fixed inset-0 z-[60] hidden"><div class="absolute inset-0 bg-black/30 backdrop-blur-md" onclick="toggleCart()"></div><div class="absolute bottom-0 left-0 right-0 md:left-auto md:top-0 md:bottom-0 md:w-[420px] bg-[#FDFBF7] border-t md:border-l border-[#EDE8E0] rounded-t-[32px] md:rounded-none flex flex-col max-h-[92vh]"><div class="p-6 flex justify-between border-b border-[#EDE8E0]"><h3 class="font-black">طلبك</h3><button onclick="toggleCart()" class="w-9 h-9 rounded-full bg-black text-white"><i class="fa-solid fa-xmark"></i></button></div><div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-3"></div><div class="p-6 bg-white border-t border-[#EDE8E0] space-y-3"><div class="flex justify-between font-black text-lg"><span>الإجمالي</span><span id="cart-final">0ج</span></div><form onsubmit="sendWA(event)" class="space-y-3"><input id="n" required placeholder="الاسم" class="w-full bg-[#F8F5EF] border border-[#EDE8E0] rounded-full px-5 py-3.5 text-sm"><div class="grid grid-cols-2 gap-3"><input id="p" required placeholder="رقم الهاتف" class="bg-[#F8F5EF] border rounded-full px-5 py-3.5 text-sm"><input id="a" required placeholder="العنوان" class="bg-[#F8F5EF] border rounded-full px-5 py-3.5 text-sm"></div><button class="w-full bg-black text-white rounded-full py-4 font-black"><i class="fa-brands fa-whatsapp"></i> اطلب واتساب 01015861991</button></form></div></div></div>

<script>
const offersData=[
  {id:101,title:"عرض الدمار الأول",desc:"٢ كبدة فينو + ٢ سدق فينو + ١ كفته فينو",price:50,old:75,img:"https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=600"},
  {id:102,title:"العرض التاني",desc:"٤ كفته فينو + ٤ سدق فينو + ٢ كبدة فينو",price:100,old:130,img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600"},
  {id:103,title:"العرض التالت",desc:"٥ حواوشي",price:100,old:125,img:"https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?q=80&w=600"},
  {id:104,title:"العرض الرابع",desc:"٢ كفته بلدي + ٢ سدق بلدي + ٢ حواوشي",price:110,old:140,img:"https://images.unsplash.com/photo-1528605248644-14dd04022da1?q=80&w=600"},
  {id:105,title:"عرض العيلة",desc:"١٠ سدق فينو + ٥ كفته فينو + ٥ كبدة فينو",price:220,old:260,img:"https://images.unsplash.com/photo-1509722747041-616f39b57569?q=80&w=600"},
];

const menuData=[
  {n:"كبدة فينو",p:15,img:"https://images.unsplash.com/photo-1484980972926-edee96e0960d?q=80&w=600",t:"كبدة اسكندراني"},
  {n:"سدق فينو",p:10,img:"https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?q=80&w=600",t:"سدق اسكندراني"},
  {n:"كفته فينو",p:15,img:"https://images.unsplash.com/photo-1521390188840-97cd3d9d6d0d?q=80&w=600",t:"كفته طاسة"},
  {n:"كبدة ردة فينو",p:15,img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=600",t:"كبدة ردة"},
  {n:"حواوشي",p:25,img:"https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?q=80&w=600",t:"حواوشي سادة"},
];

let cart=[];
function renderOffers(){
  document.getElementById("offers").innerHTML=offersData.map(o=>`
    <div class="offer-img">
      <img src="${o.img}" class="h-56 w-full object-cover">
      <div class="p-5">
        <div class="flex justify-between"><span class="bg-black text-white text-[10px] px-3 py-1 rounded-full">${o.old-o.price}ج خصم</span><span class="text-xs line-through text-gray-400">${o.old}ج</span></div>
        <h3 class="font-black text-lg mt-3">${o.title}</h3>
        <p class="text-sm text-[#7A7469] mt-1">${o.desc}</p>
        <div class="mt-4 flex justify-between items-center"><p class="text-2xl font-black">${o.price}ج</p><button onclick="addOffer(${o.id})" class="bg-black text-white px-5 py-2.5 rounded-full text-sm font-bold">اطلب العرض</button></div>
      </div>
    </div>
  `).join('');
}
function renderMenu(){
  document.getElementById("menu").innerHTML=menuData.map(m=>`
    <div class="bg-white border border-[#EDE8E0] rounded-[24px] overflow-hidden">
      <img src="${m.img}" class="h-48 w-full object-cover">
      <div class="p-4 flex justify-between items-center">
        <div><p class="font-black text-sm">${m.n}</p><p class="text-[11px] text-[#9A8F7D]">${m.t} - عيش فينو طازة</p></div>
        <div class="flex items-center gap-2"><span class="font-black">${m.p}ج</span><button onclick="addItem('${m.n}',${m.p})" class="w-9 h-9 rounded-full bg-black text-white"><i class="fa-solid fa-plus text-xs"></i></button></div>
      </div>
    </div>
  `).join('');
}
function addOffer(id){const o=offersData.find(x=>x.id===id);cart.push({name:o.title+" - "+o.desc,price:o.price,qty:1});upd();}
function addItem(name,price){cart.push({name,price,qty:1});upd();}
function upd(){
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0),count=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById("cart-count").innerText=count;
  document.getElementById("cart-final").innerText=total+"ج";
  document.getElementById("cart-items").innerHTML=cart.map((it,i)=>`<div class="flex justify-between items-center bg-white border border-[#EDE8E0] p-3 rounded-2xl"><div class="text-sm font-bold">${it.name}</div><div class="flex gap-2 items-center"><span class="font-black text-sm">${it.price}ج</span><button onclick="cart.splice(${i},1);upd()" class="w-7 h-7 rounded-full bg-[#F8F5EF]"><i class="fa-solid fa-xmark text-xs"></i></button></div></div>`).join('')||`<div class="text-center py-10 text-gray-400">السلة فاضية</div>`;
  if(count)document.getElementById("cart").classList.remove("hidden");
}
function toggleCart(){document.getElementById("cart").classList.toggle("hidden");}
function sendWA(e){e.preventDefault();const name=document.getElementById("n").value,phone=document.getElementById("p").value,addr=document.getElementById("a").value;let tot=0,msg=`*طلب - كبدة مسعد*%0A👤 ${name}%0A📞 ${phone}%0A📍 ${addr}%0A%0A`;cart.forEach(c=>{tot+=c.price*c.qty;msg+=`• ${c.name} = ${c.price}ج%0A`;});msg+=`%0A*الإجمالي: ${tot}ج*`;window.open(`https://wa.me/201015861991?text=${msg}`,'_blank');}
renderOffers();renderMenu();
</script>
</body>
</html>
