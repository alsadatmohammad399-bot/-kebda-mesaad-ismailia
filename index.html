<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كبدة مسعد | ملك العروض - الإسماعيلية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background:#141210;color:#E8E0D2}
.card{background:#1E1B18;border:1px solid #2C2823;border-radius:28px;overflow:hidden;transition:.35s}
.card:hover{transform:translateY(-5px);border-color:#3D3730}
.price{color:#E8C39E}
.btn-dark{background:#E8E0D2;color:#141210}
.badge{background:#2C2823;color:#E8C39E;border:1px solid #3D3730}
img.food{height:210px;object-fit:cover;width:100%}
</style>
</head>
<body>

<header class="sticky top-0 z-50 bg-[#141210]/85 backdrop-blur-xl border-b border-[#2C2823]">
<div class="max-w-6xl mx-auto px-6 h-[74px] flex justify-between items-center">
<div class="flex items-center gap-3"><img src="logo.png" class="w-11 h-11 rounded-full bg-[#2C2823]"><div><h1 class="font-black">كبدة مسعد</h1><p class="text-[10px] text-[#9B9183]">MALIK EL 3OROUD</p></div></div>
<button onclick="toggleCart()" class="bg-[#E8E0D2] text-black px-6 py-2.5 rounded-full font-black text-sm flex gap-2">السلة <span id="cart-count" class="bg-[#141210] text-[#E8E0D2] w-5 h-5 rounded-full flex items-center justify-center text-xs">0</span></button>
</div>
</header>

<section class="max-w-6xl mx-auto px-6 pt-10 pb-8">
<h2 class="text-[52px] font-black leading-[0.9]">عروض<br><span class="text-[#E8C39E]">تدمّر</span><br>السوق 👋</h2>
</section>

<section class="max-w-6xl mx-auto px-6 pb-24">
<h3 class="font-black text-lg mb-4">العروض 🔥</h3>
<div id="offers" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>

<h3 class="font-black text-lg mt-14 mb-4">السندوتشات 🔥</h3>
<div id="menu" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
</section>

<div id="cart" class="fixed inset-0 z-[70] hidden">
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="toggleCart()"></div>
<div class="absolute bottom-0 left-0 right-0 md:left-auto md:top-0 md:bottom-0 md:w-[430px] bg-[#1A1815] border-t md:border-l border-[#2C2823] rounded-t-[32px] md:rounded-none flex flex-col max-h-[94vh]">
<div class="p-6 flex justify-between border-b border-[#2C2823]"><h3 class="font-black">طلبك</h3><button onclick="toggleCart()" class="w-9 h-9 rounded-full bg-[#2C2823]"><i class="fa-solid fa-xmark"></i></button></div>
<div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
<div class="p-5 bg-[#1E1B18] border-t border-[#2C2823] space-y-3">
<div class="space-y-2 text-sm">
<div class="flex justify-between text-[#9B9183]"><span>المجموع</span><span id="subtotal">0ج</span></div>
<div class="flex justify-between font-black text-lg text-[#E8E0D2] pt-2 border-t border-[#2C2823]"><span>الإجمالي</span><span id="cart-final" class="text-[#E8C39E]">0ج + الدليفري</span></div>
</div>
<form onsubmit="sendWA(event)" class="space-y-3 pt-2">
<input id="n" required placeholder="اسمك" class="w-full bg-[#141210] border border-[#2C2823] rounded-full px-5 py-3.5 text-sm text-[#E8E0D2] outline-none">
<div class="grid grid-cols-2 gap-3"><input id="p" required placeholder="رقم الهاتف" class="bg-[#141210] border border-[#2C2823] rounded-full px-5 py-3.5 text-sm text-[#E8E0D2]"><input id="a" required placeholder="العنوان" class="bg-[#141210] border border-[#2C2823] rounded-full px-5 py-3.5 text-sm text-[#E8E0D2]"></div>
<button class="w-full bg-[#E8E0D2] text-black rounded-full py-4 font-black"><i class="fa-brands fa-whatsapp"></i> اطلب الآن - 01015861991</button>
<p class="text-[11px] text-center text-[#9B9183]">الدليفري يضاف حسب المنطقة</p>
</form>
</div>
</div>
</div>

<script>
const offers=[
 {id:101,title:"العرض الأول",desc:"٢ كبدة فينو + ٢ سدق فينو + ١ كفته فينو",price:50,old:75,img:"kebda-fino.png"},
 {id:102,title:"العرض الثاني",desc:"٤ كفته فينو + ٤ سدق فينو + ٢ كبدة فينو",price:100,old:130,img:"sedq-fino.png"},
 {id:103,title:"العرض الثالث",desc:"٥ حواوشي",price:100,old:125,img:"hawawshi.png"},
 {id:104,title:"العرض الرابع",desc:"٢ كفته بلدي + ٢ سدق بلدي + ٢ حواوشي",price:110,old:140,img:"hawawshi.png"},
 {id:105,title:"عرض العيلة",desc:"١٠ سدق فينو + ٥ كفته فينو + ٥ كبدة فينو",price:220,old:260,img:"kebda-fino.png"},
];
const menu=[
 {n:"كبدة فينو",p:15,img:"kebda-fino.png",d:"اسكندراني سبايسي"},
 {n:"سدق فينو",p:10,img:"sedq-fino.png",d:"اسكندراني محبّش"},
 {n:"حواوشي بلدي",p:25,img:"hawawshi.png",d:"رغيف بلدي مليان لحمة"},
];
let cart=[];
function render(){
 document.getElementById("offers").innerHTML=offers.map(o=>`<div class="card"><img src="${o.img}" onerror="this.src='logo.png'" class="food"><div class="p-5"><div class="flex justify-between"><span class="badge px-3 py-1 rounded-full text-[10px]">خصم ${o.old-o.price}ج</span><span class="text-xs line-through text-[#6B6560]">${o.old}ج</span></div><h3 class="font-black mt-3">${o.title}</h3><p class="text-xs text-[#9B9183] mt-1">${o.desc}</p><div class="mt-4 flex justify-between items-center"><p class="text-2xl font-black price">${o.price}ج</p><button onclick="addOffer(${o.id})" class="bg-[#E8E0D2] text-black px-5 py-2.5 rounded-full text-xs font-black">إضافة</button></div></div></div>`).join('');
 document.getElementById("menu").innerHTML=menu.map(m=>`<div class="card"><img src="${m.img}" class="food"><div class="p-4 flex justify-between items-center"><div><p class="font-black text-sm">${m.n}</p><p class="text-[11px] text-[#9B9183]">${m.d}</p><p class="price font-black mt-1">${m.p}ج</p></div><button onclick="addItem('${m.n}',${m.p})" class="w-10 h-10 rounded-full bg-[#E8E0D2] text-black flex items-center justify-center"><i class="fa-solid fa-plus text-xs"></i></button></div></div>`).join('');
}
function addOffer(id){const o=offers.find(x=>x.id===id);cart.push({name:o.title,price:o.price,qty:1});upd();}
function addItem(n,p){cart.push({name:n,price:p,qty:1});upd();}
function upd(){
 const sub=cart.reduce((s,i)=>s+i.price*i.qty,0),cnt=cart.reduce((s,i)=>s+i.qty,0);
 document.getElementById("cart-count").innerText=cnt;
 document.getElementById("subtotal").innerText=sub+"ج";
 document.getElementById("cart-final").innerText=sub+"ج + الدليفري";
 document.getElementById("cart-items").innerHTML=cart.map((it,i)=>`<div class="flex justify-between items-center bg-[#141210] border border-[#2C2823] p-3 rounded-2xl"><div class="text-sm font-bold">${it.name}</div><div class="flex gap-2 items-center"><span class="font-black text-sm price">${it.price}ج</span><button onclick="cart.splice(${i},1);upd()" class="w-7 h-7 rounded-full bg-[#2C2823]"><i class="fa-solid fa-xmark text-xs"></i></button></div></div>`).join('')||`<div class="text-center py-14 text-[#6B6560] text-sm">السلة فاضية</div>`;
 if(cnt)document.getElementById("cart").classList.remove("hidden");
}
function toggleCart(){document.getElementById("cart").classList.toggle("hidden");}
function sendWA(e){
 e.preventDefault();
 const name=document.getElementById("n").value,phone=document.getElementById("p").value,addr=document.getElementById("a").value;
 let sub=0,msg=`*طلب جديد - كبدة مسعد*%0A👤 ${name}%0A📞 ${phone}%0A📍 ${addr}%0A%0A`;
 cart.forEach(c=>{sub+=c.price*c.qty;msg+=`• ${c.name} = ${c.price}ج%0A`;});
 msg+=`%0A*الإجمالي: ${sub}ج + الدليفري*`;
 window.open(`https://wa.me/201015861991?text=${msg}`,'_blank');
}
render();
</script>
</body>
</html>
